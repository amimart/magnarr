[package]
name = "magnarr"
version = "0.1.0"
edition = "2021"
description = "magnarr CLI"

[[bin]]
name = "magnarr"
path = "src/main.rs"

[[bin]]
name = "export-schema"
path = "src/bin/export_schema.rs"

[lib]
name = "magnarr"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
url = "2"
chrono = { version = "0.4", features = ["serde"] }
humantime = "2"
humantime-serde = "1"
async-trait = "0.1"
tokio-util = "0.7"
async-graphql = { version = "7", features = ["chrono"] }
async-graphql-axum = "7"
axum = "0.8"
base64 = "0.22"

redb = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
shellexpand = "3.1.2"
config = "0.15.23"

[dev-dependencies]
tempfile = "3"
