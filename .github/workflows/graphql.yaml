name: GraphQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  schema-up-to-date:
    name: Schema is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - run: cargo run --bin export-schema -- schema.graphql.generated

      - run: diff -u schema.graphql schema.graphql.generated

  breaking-changes:
    name: Detect breaking changes
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Inspect schema changes
        id: schema-diff
        continue-on-error: true
        uses: graphql-hive/graphql-inspector@master
        with:
          schema: 'main:schema.graphql'

      - name: Require a breaking-change commit
        if: steps.schema-diff.outcome == 'failure'
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const commits = await github.paginate(
              github.rest.pulls.listCommits,
              {
                owner,
                repo,
                pull_number: context.payload.pull_request.number,
                per_page: 100,
              },
            );

            const marker =
              /(^[a-z]+(?:\([^)]+\))?!:\s|^BREAKING[ -]CHANGE:)/m;
            const breakingCommit = commits.find((commit) =>
              marker.test(commit.commit.message)
            );

            if (!breakingCommit) {
              core.setFailed(
                "The GraphQL schema contains breaking changes, but no " +
                "commit has a breaking-change marker (`type!:` or " +
                "`BREAKING CHANGE:`).",
              );
            } else {
              core.notice(
                `Breaking changes acknowledged by commit ${breakingCommit.sha}.`,
              );
            }
