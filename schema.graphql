"""
Implement the DateTime<Utc> scalar

The input/output is a string in RFC3339 format.
"""
scalar DateTime

type Download {
	infoHash: String!
	name: String!
	magnetUri: MagnetUri!
	status: DownloadStatus!
	targetDir: String!
	createdAt: DateTime!
	updatedAt: DateTime!
	importedPath: String
	error: String
}

enum DownloadStatus {
	QUEUED
	SUBMITTED
	DOWNLOADING
	COMPLETED
	IMPORTING
	IMPORTED
	FAILED
}

scalar MagnetUri

type MutationRoot {
	"""
	Submits a new download: validates the magnet, persists it, and hands it
	off to the torrent client. Returns the created download record.
	"""
	download(magnet: MagnetUri!, targetDir: String!): Download!
}

type QueryRoot {
	"""
	Health check — returns "ok" when the server is running.
	"""
	health: String!
}

"""
Directs the executor to include this field or fragment only when the `if` argument is true.
"""
directive @include(if: Boolean!) on FIELD | FRAGMENT_SPREAD | INLINE_FRAGMENT
"""
Directs the executor to skip this field or fragment when the `if` argument is true.
"""
directive @skip(if: Boolean!) on FIELD | FRAGMENT_SPREAD | INLINE_FRAGMENT
"""
Provides a scalar specification URL for specifying the behavior of custom scalar types.
"""
directive @specifiedBy(url: String!) on SCALAR
schema {
	query: QueryRoot
	mutation: MutationRoot
}
